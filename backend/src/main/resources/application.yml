server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agentarena}
    username: ${DATABASE_USER:agentarena}
    password: ${DATABASE_PASSWORD:agentarena-local}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: 300000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
arena:
  scenarios-path: ${SCENARIOS_PATH:../scenarios}
  max-queued-runs: ${MAX_QUEUED_RUNS:20}
  models: fake-safe,fake-unsafe,gpt-4.1-mini
