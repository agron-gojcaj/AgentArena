name: Validate MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentarena_test
          POSTGRES_USER: agentarena
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentarena -d agentarena_test" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.lock
      - run: pip install -r worker/requirements.lock && pip install --no-deps -e worker
      - run: pytest worker/tests -q
        env:
          TEST_DATABASE_URL: postgresql://agentarena:test-password@localhost:5432/agentarena_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
